name: Build APK
on:
  push:
    branches: [ main master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Lihat daftar file
        run: ls -la  # ➡️ Cek apakah file HTML ada

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Inisialisasi proyek
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # ✅ KUNCI: Buat folder 'public' & pindahkan semua file web ke sana
      - name: Siapkan folder web
        run: |
          mkdir -p public
          if [ -f index.html ]; then mv *.html *.css *.js public/ 2>/dev/null || true; fi
          ls -la public/

      # ✅ Konfigurasi otomatis — TIDAK PERLU file capacitor.config.json
      - name: Inisialisasi Capacitor
        run: |
          npx cap init "Grok Bot" com.grokbot.terminal --web-dir=public
          npx cap add android
          npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grok-Bot-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
