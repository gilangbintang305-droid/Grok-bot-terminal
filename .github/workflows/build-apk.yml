name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Lihat isi folder
        run: |
          ls -la
          ls -la public/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Siapkan proyek
        run: |
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Konfigurasi & Tambah Android
        run: |
          npx cap init "Grok Bot" com.grokbot.terminal --web-dir=public --force
          npx cap add android
          npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Grok-Bot-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
